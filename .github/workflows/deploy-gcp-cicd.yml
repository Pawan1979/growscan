name: GrocScan CI/CD — Google Cloud Run Testing Deployment

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-south1

jobs:
  # STEP 1: TEST & BUILD VALIDATION
  test-and-build:
    name: 🧪 Run Automated Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Test Backend (Jest)
        run: |
          npm ci --prefix backend
          npm test --prefix backend

      - name: Install & Test Frontend (Vitest)
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend

      - name: Verify Backend Build
        run: npm run build --prefix backend

      - name: Verify Frontend Build
        run: npm run build --prefix frontend

  # STEP 2: DEPLOY TO GOOGLE CLOUD RUN (Triggered on push to main/staging)
  deploy-to-gcp:
    name: 🚀 Build Containers & Deploy to GCP Cloud Run
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # Build & Deploy Backend
      - name: Build Backend Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/grocscan-repo/grocscan-backend:test ./backend

      - name: Push Backend Image
        run: |
          docker push asia-south1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/grocscan-repo/grocscan-backend:test

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy grocscan-backend-test \
            --image asia-south1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/grocscan-repo/grocscan-backend:test \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars NODE_ENV=production,CACHE_TTL_SECONDS=21600

      # Build & Deploy Frontend
      - name: Build Frontend Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/grocscan-repo/grocscan-frontend:test ./frontend

      - name: Push Frontend Image
        run: |
          docker push asia-south1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/grocscan-repo/grocscan-frontend:test

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy grocscan-frontend-test \
            --image asia-south1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/grocscan-repo/grocscan-frontend:test \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3
